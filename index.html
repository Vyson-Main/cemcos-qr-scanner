
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CEMCOS QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f3f4f6;
      color: #202124;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0 0 6px;
      font-size: 25px;
    }

    .header p {
      margin: 0;
      color: #666;
      font-size: 14px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #174ea6;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .secondary {
      background: #5f6368;
    }

    .save {
      background: #188038;
    }

    .field {
      margin: 13px 0;
    }

    label {
      display: block;
      font-size: 13px;
      color: #666;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #dadce0;
      border-radius: 7px;
      font-size: 15px;
      background: white;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat {
      background: #f8f9fa;
      padding: 14px;
      border-radius: 8px;
    }

    .stat strong {
      display: block;
      font-size: 24px;
      margin-top: 5px;
    }

    .stat span {
      color: #666;
      font-size: 12px;
    }

    #message {
      display: none;
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
      font-size: 14px;
      line-height: 1.5;
    }

    .info {
      display: block !important;
      background: #e8f0fe;
      color: #174ea6;
    }

    .success {
      display: block !important;
      background: #e6f4ea;
      color: #137333;
    }

    .warning {
      display: block !important;
      background: #fef7e0;
      color: #8a5b00;
    }

    .error {
      display: block !important;
      background: #fce8e6;
      color: #c5221f;
    }

    .hint {
      color: #777;
      font-size: 12px;
      line-height: 1.5;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>CEMCOS QR Scanner</h1>
      <p>Student collection encoding system</p>
    </div>

    <!-- QR SCANNER -->
    <div class="card">
      <h3>Scanner</h3>

      <div id="reader"></div>

      <button id="startButton" onclick="startScanner()">
        START SCANNER
      </button>

      <button id="stopButton"
              class="secondary hidden"
              onclick="stopScanner()">
        STOP SCANNER
      </button>

      <p class="hint">
        Allow camera access when your browser asks.
        Point the camera at the QR code on the student ID.
      </p>
    </div>

    <!-- STUDENT INFORMATION -->
    <div class="card">
      <h3>Student Information</h3>

      <div class="field">
        <label>Student Name</label>
        <input
          id="studentName"
          type="text"
          placeholder="Student name">
      </div>

      <div class="field">
        <label>Program</label>
        <input
          id="studentProgram"
          type="text"
          placeholder="Program"
          readonly>
      </div>

      <div id="message"></div>

      <button
        id="saveButton"
        class="save"
        onclick="saveStudent()"
        disabled>
        SAVE STUDENT
      </button>

      <button class="secondary" onclick="clearForm()">
        CLEAR
      </button>
    </div>

    <!-- STATISTICS -->
    <div class="card">
      <h3>Collection Statistics</h3>

      <div class="stats">

        <div class="stat">
          <span>Encoded Students</span>
          <strong id="encodedCount">—</strong>
        </div>

        <div class="stat">
          <span>Available Rows</span>
          <strong id="availableRows">—</strong>
        </div>

      </div>

      <button class="secondary" onclick="loadStats()">
        REFRESH STATISTICS
      </button>
    </div>

  </div>

  <!-- HIDDEN FORM FOR SAVING -->
  <form
    id="saveForm"
    method="POST"
    target="saveFrame"
    class="hidden">

    <input type="hidden" name="action" value="save">
    <input type="hidden" name="name" id="formName">
    <input type="hidden" name="program" id="formProgram">

  </form>

  <iframe
    name="saveFrame"
    id="saveFrame"
    class="hidden">
  </iframe>


  <script>

    // GOOGLE APPS SCRIPT WEB APP URL
    const API_URL =
      'https://script.google.com/macros/s/AKfycbzbNVEZcOuMsl0fYf_l5qMmoT7toP3cEpzMPp-w9sZM_R3EjrbRGByHqqbFi-F_3Lhg/exec';


    // PROGRAM CODE CONVERSION
    const PROGRAM_CODES = {
      BSCS: 'Computer Science',
      BSIT: 'Information Technology',
      BSTCM: 'Technology Communication Management',
      DS: 'Data Science'
    };


    let scanner = null;
    let scannerRunning = false;
    let saving = false;
    let currentDuplicate = false;


    // DISPLAY MESSAGE
    function showMessage(message, type) {
      const box = document.getElementById('message');

      box.textContent = message;
      box.className = type;
    }


    // CLEAR MESSAGE
    function clearMessage() {
      const box = document.getElementById('message');

      box.textContent = '';
      box.className = '';
    }


    // EXTRACT NAME AND PROGRAM FROM QR CODE
    function parseStudentQR(rawText) {

      const text = String(rawText || '')
        .replace(/\s+/g, ' ')
        .trim();

      const programMatch = text.match(
        /\b(BSCS|BSIT|BSTCM|DS)\b/i
      );

      if (!programMatch) {
        throw new Error(
          'The QR code does not contain a recognized program code.'
        );
      }

      const programCode = programMatch[1].toUpperCase();

      let name = text.substring(0, programMatch.index);

      // Remove student number
      name = name.replace(/\b\d{8,}\b/g, '').trim();

      name = name.replace(/\s+/g, ' ');

      if (!name) {
        throw new Error(
          'Could not extract the student name from this QR code.'
        );
      }

      return {
        name: name,
        program: PROGRAM_CODES[programCode]
      };
    }


    // GOOGLE APPS SCRIPT JSONP REQUEST
    function jsonp(params, callback) {

      const callbackName =
        'cemcosCallback_' +
        Date.now() +
        '_' +
        Math.floor(Math.random() * 100000);

      const script = document.createElement('script');

      const query = new URLSearchParams({
        ...params,
        callback: callbackName
      });

      window[callbackName] = function(result) {

        callback(result);

        delete window[callbackName];

        script.remove();
      };

      script.onerror = function() {

        delete window[callbackName];

        script.remove();

        showMessage(
          'Could not connect to the spreadsheet. Check your Apps Script deployment.',
          'error'
        );
      };

      script.src = API_URL + '?' + query.toString();

      document.body.appendChild(script);
    }


    // CHECK FOR DUPLICATE STUDENT
    function checkDuplicate(name) {

      currentDuplicate = false;

      showMessage(
        'Checking for duplicate entries...',
        'info'
      );

      jsonp(
        {
          action: 'check',
          name: name
        },
        function(result) {

          if (!result.success) {

            showMessage(
              result.message || 'Could not check duplicates.',
              'error'
            );

            return;
          }

          currentDuplicate = result.duplicate;

          if (result.duplicate) {

            showMessage(
              'WARNING: This student name already exists in row(s): ' +
              result.rows.join(', ') +
              '. You may still save this entry.',
              'warning'
            );

          } else {

            showMessage(
              'Student information is ready. Review it before saving.',
              'success'
            );

          }

          document.getElementById('saveButton').disabled = false;

        }
      );
    }


    // WHEN QR CODE IS SUCCESSFULLY SCANNED
    function onScanSuccess(decodedText) {

      if (scannerRunning) {
        stopScanner();
      }

      try {

        const student = parseStudentQR(decodedText);

        document.getElementById('studentName').value =
          student.name;

        document.getElementById('studentProgram').value =
          student.program;

        document.getElementById('saveButton').disabled = true;

        checkDuplicate(student.name);

      } catch (error) {

        showMessage(error.message, 'error');

      }
    }


    // START CAMERA
    async function startScanner() {

      clearMessage();

      try {

        if (!scanner) {
          scanner = new Html5Qrcode('reader');
        }

        await scanner.start(
          { facingMode: 'environment' },
          {
            fps: 10,
            qrbox: {
              width: 250,
              height: 250
            }
          },
          onScanSuccess
        );

        scannerRunning = true;

        document
          .getElementById('startButton')
          .classList.add('hidden');

        document
          .getElementById('stopButton')
          .classList.remove('hidden');

      } catch (error) {

        showMessage(
          'Unable to start the camera. Allow camera access and use the site over HTTPS.',
          'error'
        );

      }
    }


    // STOP CAMERA
    async function stopScanner() {

      if (scanner && scannerRunning) {

        try {

          await scanner.stop();

          scannerRunning = false;

        } catch (error) {

          console.error(error);

        }

      }

      document
        .getElementById('startButton')
        .classList.remove('hidden');

      document
        .getElementById('stopButton')
        .classList.add('hidden');
    }


    // SAVE STUDENT
    function saveStudent() {

      if (saving) return;

      const name = document
        .getElementById('studentName')
        .value
        .trim();

      const program = document
        .getElementById('studentProgram')
        .value
        .trim();

      if (!name || !program) {

        showMessage(
          'Scan a valid student ID first.',
          'error'
        );

        return;
      }

      const confirmation = currentDuplicate
        ? 'This name already exists. Do you still want to save this duplicate entry?'
        : 'Save this student to the spreadsheet?';

      if (!window.confirm(confirmation)) return;

      saving = true;

      document.getElementById('saveButton').disabled = true;

      showMessage(
        'Saving student...',
        'info'
      );

      document.getElementById('formName').value = name;

      document.getElementById('formProgram').value = program;

      document.getElementById('saveForm').action = API_URL;

      document.getElementById('saveForm').submit();
    }


    // RECEIVE SAVE RESULT FROM APPS SCRIPT
    window.addEventListener('message', function(event) {

      if (
        !event.data ||
        event.data.type !== 'CEMCOS_SAVE_RESULT'
      ) {
        return;
      }

      saving = false;

      const result = event.data.result;

      if (result.success) {

        showMessage(
          'Student saved successfully in row ' + result.row + '.',
          'success'
        );

        clearForm();

        loadStats();

      } else {

        showMessage(
          result.message || 'Unable to save student.',
          'error'
        );

        document.getElementById('saveButton').disabled = false;

      }

    });


    // CLEAR STUDENT INFORMATION
    function clearForm() {

      document.getElementById('studentName').value = '';

      document.getElementById('studentProgram').value = '';

      document.getElementById('saveButton').disabled = true;

      currentDuplicate = false;

      clearMessage();
    }


    // LOAD STATISTICS
    function loadStats() {

      jsonp(
        {
          action: 'stats'
        },
        function(result) {

          if (!result.success) {

            showMessage(
              result.message || 'Could not load statistics.',
              'error'
            );

            return;
          }

          document.getElementById('encodedCount').textContent =
            result.encodedCount;

          document.getElementById('availableRows').textContent =
            result.availableRows;

        }
      );
    }


    // LOAD STATISTICS WHEN PAGE OPENS
    loadStats();

  </script>

</body>
</html>
