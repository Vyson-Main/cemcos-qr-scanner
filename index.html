<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CEMCOS QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root {
      --bg: #0b0b0b;
      --sheet: #141414;
      --card: #1c1c1c;
      --line: #2e2a1f;
      --gold: #d4af37;
      --gold-light: #f1d26a;
      --gold-dark: #a8861f;
      --text: #f5f1e6;
      --muted: #9a9484;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 18px 16px 30px;
    }

    /* HEADER + LOGO SPACE */
    .header {
      text-align: center;
      margin-bottom: 14px;
    }

    .logo-box {
      width: 72px;
      height: 72px;
      margin: 4px auto 12px;
      border-radius: 50%;
      border: 1.5px dashed var(--gold-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold-dark);
      font-size: 11px;
      letter-spacing: 1px;
      overflow: hidden;
      background: rgba(212, 175, 55, 0.06);
    }

    .logo-box {
      position: relative;
    }

    .logo-box .logo-text {
      position: absolute;
    }

    .logo-box img {
      position: relative;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: var(--bg);
    }

    .header h1 {
      margin: 0 0 4px;
      font-size: 22px;
      letter-spacing: 0.5px;
      color: var(--gold);
    }

    .header p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    /* SHEET CARDS */
    .card {
      background: var(--sheet);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 22px 18px;
      margin-bottom: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }

    .card h3 {
      margin: 0 0 6px;
      text-align: center;
      font-size: 17px;
      color: var(--text);
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
      margin: 8px 0 0;
    }

    /* SCANNER FRAME */
    .scan-frame {
      position: relative;
      width: 100%;
      max-width: 320px;
      aspect-ratio: 1 / 1;
      margin: 18px auto 14px;
      padding: 18px;
    }

    .scan-frame .corner {
      position: absolute;
      width: 46px;
      height: 46px;
      border: 4px solid var(--gold);
      z-index: 3;
      pointer-events: none;
    }

    .corner.tl { top: 0; left: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 22px; }
    .corner.tr { top: 0; right: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 22px; }
    .corner.bl { bottom: 0; left: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 22px; }
    .corner.br { bottom: 0; right: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 22px; }

    .scan-inner {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #0e0e0e;
    }

    .qr-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-placeholder svg {
      width: 62%;
      height: 62%;
      opacity: 0.9;
    }

    #reader {
      position: absolute;
      inset: 0;
      width: 100%;
      border: 0 !important;
      overflow: hidden;
    }

    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
    }

    .scan-line {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold-light), transparent);
      box-shadow: 0 0 12px var(--gold);
      z-index: 2;
      animation: sweep 2.2s ease-in-out infinite;
    }

    .scanning .scan-line { display: block; }
    .scanning .qr-placeholder { display: none; }

    @keyframes sweep {
      0%   { top: 4%; }
      50%  { top: 94%; }
      100% { top: 4%; }
    }

    /* BUTTONS */
    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--gold-light), var(--gold) 55%, var(--gold-dark));
      color: #151208;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:active { transform: scale(0.98); }

    button:disabled {
      background: #2a2a2a;
      color: #6d6a60;
      cursor: not-allowed;
    }

    .secondary {
      background: transparent;
      color: var(--gold);
      border: 1px solid var(--gold-dark);
    }

    .save {
      background: linear-gradient(135deg, var(--gold-light), var(--gold) 55%, var(--gold-dark));
    }

    /* FORM FIELDS */
    .field { margin: 14px 0; }

    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    input, select {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      font-size: 15px;
      background: var(--card);
      color: var(--text);
      outline: none;
    }

    input::placeholder { color: #6d6a60; }

    input:focus, select:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
    }

    select option { background: #1c1c1c; color: var(--text); }

    /* MESSAGES */
    #message {
      display: none;
      padding: 12px 14px;
      border-radius: 12px;
      margin-top: 12px;
      font-size: 14px;
      line-height: 1.5;
    }

    .info {
      display: block !important;
      background: rgba(212, 175, 55, 0.1);
      color: var(--gold-light);
      border: 1px solid var(--gold-dark);
    }

    .success {
      display: block !important;
      background: rgba(76, 175, 80, 0.12);
      color: #7bd88f;
      border: 1px solid #2f6b3a;
    }

    .warning {
      display: block !important;
      background: rgba(255, 170, 0, 0.12);
      color: #ffc24d;
      border: 1px solid #8a5b00;
    }

    .error {
      display: block !important;
      background: rgba(255, 82, 82, 0.12);
      color: #ff8a80;
      border: 1px solid #8f2d2d;
    }

    .hidden { display: none; }
  </style>
</head>

<body>

  <div class="container">

    <!-- HEADER (put your logo in the circle below) -->
    <div class="header">
      <div class="logo-box" id="logoBox">
        <span class="logo-text">LOGO</span>
        <!-- Auto-loads "logo.png" from the same folder. If the file is missing, the LOGO placeholder stays. -->
        <img src="logo.png" alt="" onerror="this.remove()">
      </div>
      <h1>CEMCOS QR Scanner</h1>
      <p>Student collection encoding system</p>
    </div>

    <!-- QR SCANNER -->
    <div class="card">
      <h3>Scan QR Code</h3>
      <p class="hint">
        Place the QR code on the student ID inside the frame.
        Hold steady for quick results.
      </p>

      <div class="scan-frame" id="scanFrame">
        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>

        <div class="scan-inner">
          <div class="qr-placeholder">
            <svg viewBox="0 0 100 100" fill="none" stroke="#d4af37" stroke-width="7" stroke-linejoin="round">
              <rect x="8" y="8" width="30" height="30" rx="5"/>
              <rect x="62" y="8" width="30" height="30" rx="5"/>
              <rect x="8" y="62" width="30" height="30" rx="5"/>
              <rect x="18" y="18" width="10" height="10" fill="#d4af37" stroke="none"/>
              <rect x="72" y="18" width="10" height="10" fill="#d4af37" stroke="none"/>
              <rect x="18" y="72" width="10" height="10" fill="#d4af37" stroke="none"/>
              <path d="M52 52h12v12M80 52v12M52 80h12M80 80h12" stroke-linecap="round"/>
            </svg>
          </div>
          <div id="reader"></div>
          <div class="scan-line"></div>
        </div>
      </div>

      <button id="startButton" onclick="startScanner()">
        START SCANNER
      </button>

      <button id="stopButton"
              class="secondary hidden"
              onclick="stopScanner()">
        STOP SCANNER
      </button>

      <p class="hint">Allow camera access when your browser asks.</p>
    </div>

    <!-- STUDENT INFORMATION -->
    <div class="card">
      <h3>Student Information</h3>

      <div class="field">
        <label>Student Name</label>
        <input
          id="studentName"
          type="text"
          placeholder="Student name">
      </div>

      <div class="field">
        <label>Program</label>
        <select id="studentProgram">
          <option value="">Select program</option>
          <option value="Computer Science">Computer Science</option>
          <option value="Information Technology">Information Technology</option>
          <option value="Technology Communication Management">Technology Communication Management</option>
          <option value="Data Science">Data Science</option>
        </select>
      </div>

      <div id="message"></div>

      <button
        id="saveButton"
        class="save"
        onclick="saveStudent()"
        disabled>
        SAVE STUDENT
      </button>

      <button class="secondary" onclick="clearForm()">
        CLEAR
      </button>
    </div>

  </div>

  <!-- HIDDEN FORM FOR SAVING -->
  <form
    id="saveForm"
    method="POST"
    target="saveFrame"
    class="hidden">

    <input type="hidden" name="action" value="save">
    <input type="hidden" name="name" id="formName">
    <input type="hidden" name="program" id="formProgram">

  </form>

  <iframe
    name="saveFrame"
    id="saveFrame"
    class="hidden">
  </iframe>


  <script>

    // GOOGLE APPS SCRIPT WEB APP URL
    const API_URL =
      'https://script.google.com/macros/s/AKfycbzbNVEZcOuMsl0fYf_l5qMmoT7toP3cEpzMPp-w9sZM_R3EjrbRGByHqqbFi-F_3Lhg/exec';


    // PROGRAM CODE CONVERSION
    const PROGRAM_CODES = {
      BSCS: 'Computer Science',
      BSIT: 'Information Technology',
      BSTCM: 'Technology Communication Management',
      DS: 'Data Science'
    };


    let scanner = null;
    let scannerRunning = false;
    let saving = false;
    let currentDuplicate = false;
    let checkToken = 0;
    let saveTimer = null;


    // DISPLAY MESSAGE
    function showMessage(message, type) {
      const box = document.getElementById('message');

      box.textContent = message;
      box.className = type;
    }


    // CLEAR MESSAGE
    function clearMessage() {
      const box = document.getElementById('message');

      box.textContent = '';
      box.className = '';
    }


    // EXTRACT NAME AND PROGRAM FROM QR CODE
    // Format: NAME <tab> STUDENT NUMBER <tab> PROGRAM
    // e.g.  NATHANIEL ROSELL E. BEATISULA   2023305573   BSCS
    function parseStudentQR(rawText) {

      const text = String(rawText || '')
        .replace(/\s+/g, ' ')
        .trim();

      // Exact format: everything before the student number is the name,
      // the last word is the program code.
      let match = text.match(
        /^(.+?)\s+(\d{8,})\s+(BSCS|BSIT|BSTCM|DS)$/i
      );

      // Fallback for slightly different layouts
      if (!match) {
        const alt = text.match(/\b(BSCS|BSIT|BSTCM|DS)\b(?!.*\b(BSCS|BSIT|BSTCM|DS)\b)/i);

        if (!alt) {
          throw new Error(
            'The QR code does not contain a recognized program code.'
          );
        }

        const name = text
          .substring(0, alt.index)
          .replace(/\b\d{8,}\b/g, '')
          .replace(/\s+/g, ' ')
          .trim();

        match = [null, name, null, alt[1]];
      }

      const name = match[1].trim();
      const programCode = match[3].toUpperCase();

      if (!name) {
        throw new Error(
          'Could not extract the student name from this QR code.'
        );
      }

      return {
        name: name,
        program: PROGRAM_CODES[programCode]
      };
    }


    // GOOGLE APPS SCRIPT JSONP REQUEST
    function jsonp(params, callback, silent) {

      const callbackName =
        'cemcosCallback_' +
        Date.now() +
        '_' +
        Math.floor(Math.random() * 100000);

      const script = document.createElement('script');

      const query = new URLSearchParams({
        ...params,
        callback: callbackName
      });

      window[callbackName] = function(result) {

        callback(result);

        delete window[callbackName];

        script.remove();
      };

      script.onerror = function() {

        delete window[callbackName];

        script.remove();

        if (!silent) {
          showMessage(
            'Could not connect to the spreadsheet. Check your Apps Script deployment.',
            'error'
          );
        }
      };

      script.src = API_URL + '?' + query.toString();

      document.body.appendChild(script);
    }


    // CHECK FOR DUPLICATE STUDENT
    function checkDuplicate(name) {

      currentDuplicate = false;

      const myToken = ++checkToken;

      showMessage(
        'Checking for duplicate entries...',
        'info'
      );

      jsonp(
        {
          action: 'check',
          name: name
        },
        function(result) {

          // Ignore outdated responses (name was edited meanwhile)
          if (myToken !== checkToken) return;

          if (!result.success) {

            showMessage(
              result.message || 'Could not check duplicates.',
              'error'
            );

            return;
          }

          currentDuplicate = result.duplicate;

          if (result.duplicate) {

            showMessage(
              'WARNING: This student name already exists in row(s): ' +
              result.rows.join(', ') +
              '. You may still save this entry.',
              'warning'
            );

          } else {

            showMessage(
              'Student information is ready. Review it before saving.',
              'success'
            );

          }

          refreshSaveState();

        }
      );
    }


    // WHEN QR CODE IS SUCCESSFULLY SCANNED
    function onScanSuccess(decodedText) {

      if (scannerRunning) {
        stopScanner();
      }

      try {

        const student = parseStudentQR(decodedText);

        document.getElementById('studentName').value =
          student.name;

        document.getElementById('studentProgram').value =
          student.program;

        document.getElementById('saveButton').disabled = true;

        checkDuplicate(student.name);

      } catch (error) {

        showMessage(error.message, 'error');

      }
    }


    // START CAMERA
    async function startScanner() {

      clearMessage();

      try {

        if (!scanner) {
          scanner = new Html5Qrcode('reader');
        }

        await scanner.start(
          { facingMode: 'environment' },
          {
            fps: 10,
            qrbox: {
              width: 250,
              height: 250
            }
          },
          onScanSuccess
        );

        scannerRunning = true;

        document.getElementById('scanFrame').classList.add('scanning');

        document
          .getElementById('startButton')
          .classList.add('hidden');

        document
          .getElementById('stopButton')
          .classList.remove('hidden');

      } catch (error) {

        showMessage(
          'Unable to start the camera. Allow camera access and use the site over HTTPS.',
          'error'
        );

      }
    }


    // STOP CAMERA
    async function stopScanner() {

      if (scanner && scannerRunning) {

        try {

          await scanner.stop();

          scannerRunning = false;

        } catch (error) {

          console.error(error);

        }

      }

      document.getElementById('scanFrame').classList.remove('scanning');

      document
        .getElementById('startButton')
        .classList.remove('hidden');

      document
        .getElementById('stopButton')
        .classList.add('hidden');
    }


    // SAVE STUDENT
    function saveStudent() {

      if (saving) return;

      const name = document
        .getElementById('studentName')
        .value
        .trim();

      const program = document
        .getElementById('studentProgram')
        .value
        .trim();

      if (!name || !program) {

        showMessage(
          'Scan a valid student ID first.',
          'error'
        );

        return;
      }

      const confirmation = currentDuplicate
        ? 'This name already exists. Do you still want to save this duplicate entry?'
        : 'Save this student to the spreadsheet?';

      if (!window.confirm(confirmation)) return;

      saving = true;

      document.getElementById('saveButton').disabled = true;

      showMessage(
        'Saving student...',
        'info'
      );

      document.getElementById('formName').value = name;

      document.getElementById('formProgram').value = program;

      document.getElementById('saveForm').action = API_URL;

      document.getElementById('saveForm').submit();

      // If no reply arrives (offline / server busy), unlock the form
      clearTimeout(saveTimer);
      saveTimer = setTimeout(function() {
        if (!saving) return;
        saving = false;
        refreshSaveState();
        showMessage(
          'No response from the server. Check the spreadsheet before saving again, to avoid a duplicate.',
          'error'
        );
      }, 30000);
    }


    // RECEIVE SAVE RESULT FROM APPS SCRIPT
    window.addEventListener('message', function(event) {

      if (
        !event.data ||
        event.data.type !== 'CEMCOS_SAVE_RESULT'
      ) {
        return;
      }

      saving = false;
      clearTimeout(saveTimer);

      const result = event.data.result;

      if (result.success) {

        showMessage(
          'Student saved successfully in row ' + result.row + '.',
          'success'
        );

        clearForm();

      } else {

        showMessage(
          result.message || 'Unable to save student.',
          'error'
        );

        refreshSaveState();

      }

    });


    // CLEAR STUDENT INFORMATION
    function clearForm() {

      document.getElementById('studentName').value = '';

      document.getElementById('studentProgram').value = '';

      document.getElementById('saveButton').disabled = true;

      currentDuplicate = false;

      checkToken++;

      clearMessage();
    }


    // MANUAL ENTRY SUPPORT (typing name / choosing program)
    let nameTimer = null;

    function refreshSaveState() {
      const name = document.getElementById('studentName').value.trim();
      const program = document.getElementById('studentProgram').value;
      document.getElementById('saveButton').disabled =
        saving || !name || !program;
    }

    document.getElementById('studentName').addEventListener('input', function() {
      checkToken++;                 // invalidate any pending check
      currentDuplicate = false;
      clearTimeout(nameTimer);
      document.getElementById('saveButton').disabled = true;

      const name = this.value.trim();
      if (!name) { clearMessage(); return; }

      nameTimer = setTimeout(function() {
        checkDuplicate(name);       // enables Save when the check returns
      }, 600);
    });

    document.getElementById('studentProgram').addEventListener('change', function() {
      refreshSaveState();
    });


  </script>

</body>
</html>
